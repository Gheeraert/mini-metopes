[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-metopes"
version = "0.1.0"
description = "Validation normative TEI Commons Publishing pour Mini-Métopes"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Mini-Métopes" }]
dependencies = ["lxml>=5"]

[project.optional-dependencies]
dev = ["build>=1", "pytest>=8"]

[project.scripts]
mini-metopes = "mini_metopes.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["mini_metopes*"]
exclude = ["references*", "tests*"]

[tool.setuptools.package-data]
mini_metopes = ["resources/schemas/commons-publishing/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
